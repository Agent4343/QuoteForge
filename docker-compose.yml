# Local development only (§6). Production runs the single Dockerfile on Railway.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: quoteforge
      POSTGRES_PASSWORD: quoteforge
      POSTGRES_DB: quoteforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quoteforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://quoteforge:quoteforge@db:5432/quoteforge
      JWT_SECRET: dev-insecure-change-me
      ENVIRONMENT: dev
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
