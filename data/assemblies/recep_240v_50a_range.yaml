schema_version: "1.0"
id: recep_240v_50a_range
category: devices
trade: electrical
work_type: [service, renovation]
names:
  en: "240V 50A range receptacle"
  fr: "Prise de cuisinière 240V 50A"
description:
  en: "Install a 50A 240V range receptacle on a new or existing dedicated circuit."
  fr: "Installer une prise de cuisinière 240V 50A sur un circuit dédié neuf ou existant."
parameters:
