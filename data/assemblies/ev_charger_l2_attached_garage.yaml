schema_version: "1.0"
id: ev_charger_l2_attached_garage
category: ev
trade: electrical
work_type: [service, renovation]

names:
  en: "Level 2 EV charger circuit — attached garage"
  fr: "Circuit de borne de recharge VÉ niveau 2 — garage attenant"

description:
  en: "Install a 40A 240V circuit and 14-50 receptacle for a Level 2 EV charger in an attached garage."
  fr: "Installer un circuit 240V 40A et une prise 14-50 pour une borne de recharge VÉ niveau 2 dans un garage attenant."

parameters:
  wire_run_ft:
    type: number
    default: 30
    sensitivity: high
    prompt_en: "Cable run from the panel to the charger location (ft)?"
    prompt_fr: "Longueur du câble du panneau à l'emplacement de la borne (pi)?"
  routing:
    type: enum
    default: open
    values: [open, finished]
    sensitivity: high
    prompt_en: "Open/unfinished routing or fished through finished walls?"
    prompt_fr: "Parcours ouvert/non fini ou tiré dans des murs finis?"
    labor_multipliers:
      open: 1.0
      finished: 1.5

materials:
  - sku: BREAKER_40A_2P
    qty: 1
  - sku: WIRE_NMD90_8_3
    qty_formula: "wire_run_ft"
    waste: 0.10
  - sku: RECEP_EV_1450
    qty: 1
  - sku: BOX_DEVICE_METAL
    qty: 1
  - sku: WIRE_CONNECTOR
    qty: 6
  - sku: CONNECTOR_NM
    qty: 2
  - sku: STAPLE_NMD
    qty_formula: "ceil(wire_run_ft / 4)"

labor:
  base_hours: 3.0
  phase: special
  apprentice_compatible: false
  minimum_callout_applies: false

provincial_variants:
  "ON":
    code_edition: "OESC 2024 (28th)"
    permit_handling: "ESA notification required"
    code_refs:
      - section: "Rule 86-300"
        note: "Electric vehicle supply equipment branch-circuit requirements."
  "QC":
    code_edition_current: "Chapitre V (CCÉ 2015 + modifications QC)"
    code_edition_pending: "Chapitre V 2026 (CCÉ 2021 + modifications QC)"
    transition_period_until: "2026-09-26"
    customer_language_default: fr
    permit_handling: "Permis municipal requis"
    code_refs:
      - section: "Section 86"
        note: "Exigences relatives à l'alimentation des bornes de recharge VÉ."

audit_flags: []

last_reviewed: null
reviewed_by: null
status: draft
