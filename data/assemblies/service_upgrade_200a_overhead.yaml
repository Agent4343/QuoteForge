schema_version: "1.0"
id: service_upgrade_200a_overhead
category: service
trade: electrical
work_type: [service, renovation]

names:
  en: "200A overhead service upgrade"
  fr: "Mise à niveau du branchement aérien 200A"

description:
  en: "Upgrade an existing overhead service to 200A: new mast, meter base, 200A panel, and grounding."
  fr: "Mettre à niveau un branchement aérien existant à 200A : nouveau mât, base de compteur, panneau 200A et mise à la terre."

parameters:
  service_entrance_ft:
    type: number
    default: 12
    sensitivity: high
    prompt_en: "Length of service-entrance cable from weatherhead to panel (ft)?"
    prompt_fr: "Longueur du câble d'entrée du capuchon au panneau (pi)?"
  ground_run_ft:
    type: number
    default: 25
    sensitivity: low
    prompt_en: "Length of grounding conductor run (ft)?"
    prompt_fr: "Longueur du conducteur de mise à la terre (pi)?"
  panel_location:
    type: enum
    default: same_spot
    values: [same_spot, relocated]
    sensitivity: high
    prompt_en: "Will the new panel stay in the same location or be relocated?"
    prompt_fr: "Le nouveau panneau restera-t-il au même endroit ou sera-t-il déplacé?"
    labor_multipliers:
      same_spot: 1.0
      relocated: 1.4

materials:
  - sku: PANEL_200A_40CKT
    qty: 1
  - sku: METER_BASE_200A
    qty: 1
  - sku: MAST_2IN
    qty: 1
  - sku: WEATHERHEAD_2IN
    qty: 1
  - sku: CABLE_SE_2_0
    qty_formula: "service_entrance_ft"
    waste: 0.10
  - sku: GROUND_ROD
    qty: 2
  - sku: GROUND_CLAMP
    qty: 2
  - sku: ACORN_CLAMP
    qty: 1
  - sku: GROUND_6_BARE
    qty_formula: "ground_run_ft"
    waste: 0.05
  - sku: BREAKER_15A_1P
    qty: 6
  - sku: BREAKER_20A_1P
    qty: 4

labor:
  base_hours: 8.0
  phase: service
  apprentice_compatible: false
  minimum_callout_applies: false

provincial_variants:
  "ON":
    code_edition: "OESC 2024 (28th)"
    permit_handling: "ESA notification required"
    code_refs:
      - section: "Rule 6-112"
        note: "Consumer's service equipment and service-entrance requirements."
      - section: "Rule 10-700"
        note: "Grounding electrode and bonding requirements."
  "QC":
    code_edition_current: "Chapitre V (CCÉ 2015 + modifications QC)"
    code_edition_pending: "Chapitre V 2026 (CCÉ 2021 + modifications QC)"
    transition_period_until: "2026-09-26"
    customer_language_default: fr
    permit_handling: "Permis municipal et coordination Hydro-Québec requis"
    labor_override:
      base_hours: 9.0
    code_refs:
      - section: "Section 6"
        note: "Exigences relatives à l'appareillage de branchement du client."

audit_flags: []

last_reviewed: null
reviewed_by: null
status: draft
