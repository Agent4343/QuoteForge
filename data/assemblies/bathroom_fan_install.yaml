schema_version: "1.0"
id: bathroom_fan_install
category: safety
trade: electrical
work_type: [renovation, new_construction]
names:
  en: "Bathroom exhaust fan — new install"
  fr: "Ventilateur de salle de bain — nouvelle installation"
description:
  en: "Install a new bathroom exhaust fan with a switched circuit, including fan housing and wiring."
  fr: "Installer un nouveau ventilateur de salle de bain avec circuit commandé, boîtier et câblage inclus."
parameters:
  cable_run_ft: {type: number, default: 25, sensitivity: high, prompt_en: "Cable run from the source to the fan (ft)?", prompt_fr: "Longueur du câble de la source au ventilateur (pi)?"}
  ceiling_access: {type: enum, default: attic_above, values: [attic_above, no_access], sensitivity: high, prompt_en: "Attic access above, or fished blind?", prompt_fr: "Accès au grenier au-dessus, ou tiré à l'aveugle?", labor_multipliers: {attic_above: 1.0, no_access: 1.6}}
materials:
  - {sku: BATH_FAN, qty: 1}
  - {sku: SWITCH_SP, qty: 1}
  - {sku: BOX_DEVICE_PVC, qty: 1}
  - {sku: PLATE_TOGGLE, qty: 1}
  - {sku: WIRE_NMD90_14_2, qty_formula: "cable_run_ft", waste: 0.10}
  - {sku: WIRE_CONNECTOR, qty: 6}
  - {sku: STAPLE_NMD, qty_formula: "ceil(cable_run_ft / 4)"}
  - {sku: CONNECTOR_NM, qty: 2}
labor: {base_hours: 2.5, phase: trim, apprentice_compatible: true, minimum_callout_applies: true}
provincial_variants:
  "ON":
    code_edition: "OESC 2024 (28th)"
    code_refs:
      - {section: "Rule 26-700", note: "Bathroom circuits and device requirements."}
  "QC":
    code_edition_current: "Chapitre V (CCÉ 2015 + modifications QC)"
    code_edition_pending: "Chapitre V 2026 (CCÉ 2021 + modifications QC)"
    transition_period_until: "2026-09-26"
    customer_language_default: fr
    code_refs:
      - {section: "Section 26", note: "Exigences des circuits et appareils de salle de bain."}
audit_flags: []
last_reviewed: null
reviewed_by: null
status: draft
