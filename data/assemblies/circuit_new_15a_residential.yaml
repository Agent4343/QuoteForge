schema_version: "1.0"
id: circuit_new_15a_residential
category: circuits
trade: electrical
work_type: [renovation, new_construction]

names:
  en: "New 15A residential branch circuit"
  fr: "Nouveau circuit de dérivation résidentiel 15A"

description:
  en: "Run one new 15A branch circuit from the panel, including breaker and one device box."
  fr: "Installer un nouveau circuit de dérivation 15A depuis le panneau, disjoncteur et une boîte inclus."

parameters:
  run_length_ft:
    type: number
    default: 40
    sensitivity: high
    prompt_en: "Approximate cable run from the panel to the new device (ft)?"
    prompt_fr: "Longueur approximative du câble du panneau au nouvel appareil (pi)?"
  access:
    type: enum
    default: open
    values: [open, finished]
    sensitivity: high
    prompt_en: "Is the path open (unfinished) or fished through finished walls/ceilings?"
    prompt_fr: "Le parcours est-il ouvert (non fini) ou tiré dans des murs/plafonds finis?"
    labor_multipliers:
      open: 1.0
      finished: 1.6

materials:
  - sku: WIRE_NMD90_14_2
    qty_formula: "run_length_ft"
    waste: 0.10
  - sku: BREAKER_15A_1P
    qty: 1
  - sku: BOX_DEVICE_PVC
    qty: 1
  - sku: RECEP_DUPLEX_15A
    qty: 1
  - sku: PLATE_DECORA
    qty: 1
  - sku: STAPLE_NMD
    qty_formula: "ceil(run_length_ft / 4)"
  - sku: WIRE_CONNECTOR
    qty: 4
  - sku: CONNECTOR_NM
    qty: 2

labor:
  base_hours: 1.5
  phase: rough_in
  apprentice_compatible: true
  minimum_callout_applies: true

provincial_variants:
  "ON":
    code_edition: "OESC 2024 (28th)"
    permit_handling: "ESA notification required"
    code_refs:
      - section: "Rule 26-722"
        note: "Branch-circuit and dwelling-unit receptacle requirements."
      - section: "Rule 26-724"
        note: "AFCI protection required for branch circuits supplying receptacles in dwelling units."
  "QC":
    code_edition_current: "Chapitre V (CCÉ 2015 + modifications QC)"
    code_edition_pending: "Chapitre V 2026 (CCÉ 2021 + modifications QC)"
    transition_period_until: "2026-09-26"
    customer_language_default: fr
    permit_handling: "Permis municipal requis"
    code_refs:
      - section: "Section 26"
        note: "Exigences relatives aux circuits de dérivation."

audit_flags: []

last_reviewed: null
reviewed_by: null
status: draft
