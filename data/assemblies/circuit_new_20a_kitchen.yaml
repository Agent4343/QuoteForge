schema_version: "1.0"
id: circuit_new_20a_kitchen
category: circuits
trade: electrical
work_type: [renovation, new_construction]
names:
  en: "New 20A kitchen counter circuit"
  fr: "Nouveau circuit de comptoir de cuisine 20A"
description:
  en: "Run one new 20A split/dedicated kitchen counter circuit, including breaker and one device."
  fr: "Installer un nouveau circuit de comptoir de cuisine 20A, disjoncteur et un appareil inclus."
parameters:
  run_length_ft:
    type: number
    default: 45
    sensitivity: high
    prompt_en: "Cable run from the panel to the kitchen (ft)?"
    prompt_fr: "Longueur du câble du panneau à la cuisine (pi)?"
  access:
    type: enum
    default: open
    values: [open, finished]
    sensitivity: high
    prompt_en: "Open path or fished through finished walls?"
    prompt_fr: "Parcours ouvert ou tiré dans des murs finis?"
    labor_multipliers: {open: 1.0, finished: 1.6}
materials:
  - {sku: WIRE_NMD90_12_2, qty_formula: "run_length_ft", waste: 0.10}
  - {sku: BREAKER_20A_1P, qty: 1}
  - {sku: BOX_DEVICE_PVC, qty: 1}
  - {sku: RECEP_DUPLEX_20A, qty: 1}
  - {sku: PLATE_DECORA, qty: 1}
  - {sku: STAPLE_NMD, qty_formula: "ceil(run_length_ft / 4)"}
  - {sku: WIRE_CONNECTOR, qty: 4}
  - {sku: CONNECTOR_NM, qty: 2}
labor:
  base_hours: 1.6
  phase: rough_in
  apprentice_compatible: true
  minimum_callout_applies: true
provincial_variants:
  "ON":
    code_edition: "OESC 2024 (28th)"
    permit_handling: "ESA notification required"
    code_refs:
      - {section: "Rule 26-722", note: "Kitchen counter receptacle circuit requirements."}
  "QC":
    code_edition_current: "Chapitre V (CCÉ 2015 + modifications QC)"
    code_edition_pending: "Chapitre V 2026 (CCÉ 2021 + modifications QC)"
    transition_period_until: "2026-09-26"
    customer_language_default: fr
    permit_handling: "Permis municipal requis"
    code_refs:
      - {section: "Section 26", note: "Exigences des circuits de prises de comptoir de cuisine."}
audit_flags: []
last_reviewed: null
reviewed_by: null
status: draft
