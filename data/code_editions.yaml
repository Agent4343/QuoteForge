schema_version: "1.0"
_notes:
  - "Authoritative per-province electrical-code matrix. The launch provinces ON and"
  - "QC are populated in detail; the other eight are schema-ready STUBS with"
  - "best-effort values. VERIFY every edition label, effective/transition date,"
  - "regulator, and permit model against the official provincial code and regulator"
  - "(and a licensed electrician) before any of it appears on a customer document"
  - "(principle §3.6). Editions and adoption dates change on a ~3-year cycle."
  - "All provinces adopt the Canadian Electrical Code (CSA C22.1) with amendments."
  - "French strings are machine drafts pending professional review (§3.6)."
status: draft  # not yet verified by a licensed electrician (§21)

provinces:
  "ON":
    regulator:
      en: "Electrical Safety Authority (ESA)"
      fr: "Electrical Safety Authority (ESA)"
    permit_model:
      en: "ESA notification of work"
      fr: "Avis de travaux à l'ESA"
    utility: "Hydro One / local distribution company"
    customer_language_default: en
    current_edition:
      label: "OESC 2024 (28th)"
      base_cec: "CSA C22.1"
    pending_edition: null
    transition: null

  "QC":
    regulator:
      en: "Régie du bâtiment du Québec (RBQ); master electricians via CMEQ"
      fr: "Régie du bâtiment du Québec (RBQ); maîtres électriciens via la CMEQ"
    permit_model:
      en: "Municipal electrical permit + Hydro-Québec coordination"
      fr: "Permis d'électricité municipal + coordination Hydro-Québec"
    utility: "Hydro-Québec"
    customer_language_default: fr
    current_edition:
      label: "Chapitre V (CCÉ 2015 + modifications QC)"
      base_cec: "CSA C22.1:15"
    pending_edition:
      label: "Chapitre V 2026 (CCÉ 2021 + modifications QC)"
      base_cec: "CSA C22.1:21"
      effective_date: "2026-03-26"
    # During the transition window either edition may apply; after `end` the
    # pending edition is mandatory (§3.4).
    transition:
      start: "2026-03-26"
      end: "2026-09-26"

  "BC":
